id: tie
question: Two equally simple valid options, and a mutant caught for the wrong reason.
owner: engineering
reversible: true
root: .
falsifier: none, fixture
objects:
  A: [a]
  B: [b]
  channel: [ch]
ignore: []
criteria:
- {id: C1, text: a <= 2 and b <= 1, kind: tlc}
options:
- id: left
  checks:
  - criterion: C1
    tlc:
      spec: Toy.tla
      init: Init
      next: Next
      constants: {Mut: false, Atomic: false}
      invariant: Inv
      deadlock: false
  - criterion: C1
    mutant_of: C1
    tlc: {spec: ToyMut.tla, invariant: Inv}
  lint: {}
- id: right
  checks:
  - criterion: C1
    tlc:
      spec: Toy.tla
      init: Init
      next: Next
      constants: {Mut: false, Atomic: false}
      invariant: Inv
      deadlock: false
  - criterion: C1
    mutant_of: C1
    tlc: {spec: ToyMut.tla, invariant: Inv}
  lint: {}
- id: wrongreason
  checks:
  - criterion: C1
    tlc:
      spec: Toy.tla
      init: Init
      next: Next
      constants: {Mut: false, Atomic: false}
      invariant: Inv
      deadlock: false
  - criterion: C1
    mutant_of: C1
    tlc: {spec: Toy.tla, invariant: Inv}
