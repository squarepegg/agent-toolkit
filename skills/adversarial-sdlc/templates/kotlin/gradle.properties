kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g
# No long-lived daemons: a daemon started outside the sandbox must never run sandboxed builds.
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
# Pitest mutates only these classes.
sdlc.pitestTargets=__PACKAGE__.*
# Compiler-generated data-class members only. The gate fails if main code hand-writes any of these.
sdlc.pitestExcludedMethods=toString hashCode equals component* copy copy$default
sdlc.pitestThreads=2
# Test classes Pitest leaves out (space-separated globs), e.g. slow capacity tests; the test step still runs them.
# Kotest property iterations under Pitest only: add -Dkotest.proptest.default.iteration.count=N to sdlc.pitestJvmArgs.
sdlc.pitestExcludedTests=
# Incremental mutation analysis across gate runs (gate.sh --mutation-history). An incremental pass is confirmed fresh.
sdlc.pitestHistory=true
