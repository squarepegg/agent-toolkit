name: eval
# Free and deterministic: NO model calls in CI. Model runs happen on a laptop and their results are committed:
#   EVAL_PI_ARGS='["--model","provider/id"]' python3 evals/run_candidate.py evals/candidates/<id>.json   (writes evals/candidates/results/<id>.json)
# This job re-runs only the deterministic gate on the committed results, for each added/changed candidate file.
on:
  pull_request:
    paths: ["evals/candidates/**", "evals/gate.py", ".github/workflows/eval.yml"]
  workflow_dispatch:
    inputs:
      candidate: { description: "evals/candidates/<id>.json", required: true }
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
      - name: Which candidates
        id: pick
        env: { INPUT_CANDIDATE: "${{ inputs.candidate }}", BASE_REF: "${{ github.base_ref }}" }
        run: |
          if [ -n "$INPUT_CANDIDATE" ]; then c="$INPUT_CANDIDATE"
          else c=$(git diff --name-only --diff-filter=AM "origin/$BASE_REF...HEAD" -- 'evals/candidates/*.json' | grep -v '/_' | grep -v '/results/' || true); fi
          [ -n "$c" ] || echo "::notice::no candidate files changed"
          echo "list=$(printf '%s' "$c" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Gate the committed results
        if: steps.pick.outputs.list != ''
        env: { LIST: "${{ steps.pick.outputs.list }}" }
        run: |
          rc=0
          for c in $LIST; do
            id=$(basename "$c" .json); r="evals/candidates/results/$id.json"
            [ -f "$r" ] || { echo "::error::$c has no committed $r: run evals/run_candidate.py on a laptop and commit the result"; rc=2; continue; }
            uv run --no-project --python 3.13 evals/gate.py "$c" "$r" --md gate.md || rc=1
          done
          [ -f gate.md ] && cat gate.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
